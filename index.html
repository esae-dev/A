<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121a27" />
    <style>
      html,body{margin:0;background:#121a27;color-scheme:dark}
      html[data-theme="light"],html[data-theme="light"] body{background:#f6f5f3;color-scheme:light}
      #launch-brand{display:none;position:fixed;inset:0;z-index:50;place-items:center;background:#121a27;pointer-events:none}
      html[data-theme="light"] #launch-brand{background:#f6f5f3}
      html[data-launch="pending"] #launch-brand,html[data-launch="revealing"] #launch-brand,html[data-launch="ready"] #launch-brand{display:grid}
      #launch-brand img{grid-area:1/1;width:min(248px,66vw);height:auto;opacity:1;animation:launch-logo-in 120ms ease-out both}
      #launch-brand .launch-dark{display:none}
      html[data-theme="dark"] #launch-brand .launch-light{display:none}
      html[data-theme="dark"] #launch-brand .launch-dark{display:block}
      html[data-launch="ready"] #launch-brand{opacity:0;visibility:hidden;transition:opacity 180ms ease-out,visibility 0s linear 180ms}
      @keyframes launch-logo-in{from{opacity:.6}to{opacity:1}}
      @media(prefers-reduced-motion:reduce){#launch-brand{display:none!important}}
    </style>
    <script>
      (() => {
        let theme = 'dark';
        try { if (localStorage.getItem('aeha-theme-hint') === 'light') theme = 'light'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#161f2d' : '#ffffff';
        if ((matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.dataset.launch = 'pending';
          const logo = document.createElement('link');
          logo.rel = 'preload'; logo.as = 'image'; logo.href = `%BASE_URL%brand/logo-${theme}.svg`;
          document.head.append(logo);
        }
      })();
    </script>
    <meta name="description" content="AEHA — 습관 기록" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AEHA" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon-v2.png" />
    <title>AEHA</title>
  </head>
  <body>
    <div id="launch-brand" aria-hidden="true">
      <img class="launch-light" src="%BASE_URL%brand/logo-light.svg" alt="" />
      <img class="launch-dark" src="%BASE_URL%brand/logo-dark.svg" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
